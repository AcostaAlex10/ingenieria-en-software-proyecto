name: Publicar sitio de prueba (GitHub Pages)

# Publica el frontend en modo de prueba estatico (VITE_MOCK=1): sin backend,
# sin base de datos y con los datos de `FRONT/src/app/mock/datos.json`.
#
# No afecta al despliegue de Vercel: aquel compila sin VITE_MOCK y sigue
# consumiendo la API PHP de Render.
#
# Configuracion necesaria en el repositorio, una sola vez:
#   Settings -> Pages -> Source: "GitHub Actions".
#
# Sin eso el despliegue falla con "Failed to create deployment (status: 404)
# ... Ensure GitHub Pages has been enabled", aunque el job de compilacion pase.
#
# Corre en `main` y en `testing`. Incluir `main` evita tener que tocar la
# politica de ramas del entorno `github-pages`, que por defecto solo admite
# despliegues desde la rama por defecto.

on:
  push:
    branches: [main, testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar en modo de prueba
        env:
          # Rutas relativas: el sitio funciona bajo /<repo>/ sin depender del
          # nombre del repositorio.
          BASE_PATH: './'
          # Las rutas viajan en el fragmento (#/proyectos), asi recargar una
          # ruta interna no depende de que el hosting reescriba a index.html.
          VITE_HASH_ROUTER: '1'
          VITE_MOCK: '1'
        run: npm run build

      - name: Fallback de rutas para la SPA
        # Red de seguridad por si alguien entra a una ruta sin fragmento.
        run: cp dist/index.html dist/404.html

      - name: Desactivar el procesado Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: FRONT/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
