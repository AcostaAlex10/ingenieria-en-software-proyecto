name: Publicar sitio de prueba (GitHub Pages)

# Publica el frontend en modo de prueba estatico (VITE_MOCK=1): sin backend,
# sin base de datos y con datos ficticios. Solo corre en la rama `testing`, asi
# que `main` y el despliegue de Vercel no se ven afectados.
#
# Requisito de una sola vez en el repositorio:
#   1. Settings -> Pages -> Source: "GitHub Actions".
#   2. Settings -> Environments -> github-pages -> Deployment branches:
#      agregar `testing`, o el deploy falla por politica del entorno.

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONT
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Compilar en modo de prueba
        env:
          # En Pages el sitio vive en /<repo>/, no en la raiz del dominio.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MOCK: '1'
        run: npm run build

      - name: Fallback de rutas para la SPA
        # Pages no reescribe como el vercel.json: sin esto, recargar en
        # /proyectos devuelve 404.
        run: cp dist/index.html dist/404.html

      - name: Desactivar el procesado Jekyll
        run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: FRONT/dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
